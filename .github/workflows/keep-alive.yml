name: Keep Alive

# 防 Koyeb 免费实例深度休眠：ping 必须走 *.koyeb.app 域名（自定义域名无法唤醒）
# 调度策略：快速自续链为主（每棒 ~15s：1 次 ping + 立即续链），cron 兜底
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

# 默认 GITHUB_TOKEN 无 actions:write，续链 dispatch 会被 403 静默拒绝
permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Koyeb app (快速链模式)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://fascinating-brietta-xp1042-bcf3f4c7.koyeb.app/ || true)
          echo "$(date -u +%FT%TZ) ping -> HTTP $code"
      - name: 续链（重新 dispatch 自己）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            if gh api repos/xp1042/nz/actions/workflows/keep-alive.yml/dispatches -f ref=main; then
              echo "chain ok"; exit 0
            fi
            echo "retry $i"; sleep 10
          done
          echo "::warning::链条断裂，等待 cron 接管"
