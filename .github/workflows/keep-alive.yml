name: Keep Alive

# 防 Koyeb 免费实例深度休眠：ping 必须走 *.koyeb.app 域名（自定义域名无法唤醒）
# 调度策略：schedule(cron) + 自续链(dispatch 自身) 双保险；
# cron 未被 GitHub 调度时，链条保证每 ~4.5 分钟一次请求（公开仓库 Actions 免费时长不限）
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Koyeb app (驻留模式)
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://fascinating-brietta-xp1042-bcf3f4c7.koyeb.app/ || true)
            echo "$(date -u +%FT%TZ) ping #$i -> HTTP $code"
            [ $i -lt 5 ] && sleep 60 || true
          done
      - name: 续链（重新 dispatch 自己）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            if gh api repos/xp1042/nz/actions/workflows/keep-alive.yml/dispatches -f ref=main; then
              echo "chain ok"; exit 0
            fi
            echo "retry $i"; sleep 10
          done
          echo "::warning::链条断裂，等待 cron 接管"
