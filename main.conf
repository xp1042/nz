server {
    listen 7860;
    listen [::]:7860;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 伪装页无 favicon，返回 204 避免 error log 刷屏
    location = /favicon.ico {
        return 204;
        access_log off;
    }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
